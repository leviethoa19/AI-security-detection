[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "security-ai"
version = "0.1.0"
description = "Context-aware indoor security video inference and evaluation"
requires-python = ">=3.11,<3.13"
dependencies = [
  "jsonschema[format]>=4.23,<5",
]

[project.scripts]
security-ai-replay = "security_ai.replay:main"
security-ai-video = "security_ai.video:main"
security-ai-benchmark = "security_ai.benchmark:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23,<5",
]
vision = [
  "numpy>=2.0,<3",
  "opencv-python>=5.0,<6",
  "torch>=2.8,<2.14",
  "torchvision>=0.23,<0.29",
  "trackers>=2.6,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["security_ai"]

[[tool.mypy.overrides]]
module = [
  "cv2",
  "supervision.*",
  "trackers.*",
  "torchvision",
  "torchvision.models",
  "torchvision.models.detection",
  "torchvision.*",
]
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]
